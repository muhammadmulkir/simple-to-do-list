<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple to do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="title">
            <h1>Simple to do list</h1>
            <em>Type what you need and press sumbit / enter!</em>
        </header>
        <article class="input-group">
            <input id="input-task" type="text" placeholder="Type a task..."></input>
            <button id="btn-sumbit">Submit</button>
            <ul id="task-list"></ul>
        </article>
    </div>
</body>
</html>
